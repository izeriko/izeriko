<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday countdown</title>
<meta property="og:title" content="Birthday countdown">
<meta property="og:description" content="Counting down to sunrise on November 6th.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--s1:#0b0a28;--s2:#14123a;--s3:#2a2060;--h1:#241a57;--h2:#0d0b26;--day:0;--cream:#fff4e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--s2);color:var(--cream);overflow:hidden;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.fx,.sky{position:fixed;inset:0;pointer-events:none}
.sky{background:linear-gradient(var(--s1),var(--s2) 55%,var(--s3))}
.stars{opacity:calc(1 - var(--day))}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cream);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.orb{position:fixed;border-radius:50%;width:min(26vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
#sun{background:radial-gradient(circle,#fff6d6 0 40%,#ffc46b 70%,#ff9a5a);box-shadow:0 0 90px 36px rgba(255,190,100,.5)}
#moon{width:min(16vw,90px);background:radial-gradient(circle at 35% 35%,#fff 0 20%,#e8e4f4 60%,#b9b4d6);box-shadow:0 0 60px 18px rgba(200,200,255,.35)}
.hills{position:fixed;left:0;bottom:0;width:100%;height:28vh;pointer-events:none;z-index:2}
.hills svg{width:100%;height:100%;display:block}
.layer{opacity:0;transition:opacity 2s;z-index:1}
.d300 .l300,.d200 .l200,.d100 .l100,.d31 .l31,.d15 .l15{opacity:1}
.cloud{position:absolute;width:190px;height:46px;border-radius:50px;background:rgba(255,255,255,calc(.22 + var(--day)*.6));animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:80px;height:80px;left:28px;top:-40px}
.cloud:after{width:60px;height:60px;left:98px;top:-28px}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(110vw)}}
.bird{position:absolute;left:-40px;width:34px;height:14px;opacity:var(--day);animation:fly linear infinite}
.bird path{fill:none;stroke:#1d1b3a;stroke-width:2.5;stroke-linecap:round}
@keyframes fly{to{transform:translate(115vw,-30px)}}
.fly{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe27a;box-shadow:0 0 12px 4px #ffd24a;opacity:calc(1 - var(--day));animation:wob 6s ease-in-out infinite alternate}
@keyframes wob{to{transform:translate(40px,-60px)}}
.balloon{position:absolute;bottom:-160px;width:46px;height:58px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#fff8 0 12%,var(--c) 40%);animation:rise linear infinite;display:none}
.balloon:after{content:"";position:absolute;left:50%;top:100%;height:70px;border-left:1px solid rgba(255,244,224,.6)}
.d100 .balloon{display:block}
.balloon.more{display:none}
.d31 .balloon.more{display:block}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(24px,-60vh)}to{transform:translate(-10px,-125vh)}}
.bunting{position:fixed;top:0;left:0;width:100%;display:flex;gap:2px;transform:translateY(-100%);transition:transform 1.5s}
.d31 .bunting{transform:none}
.bunting:before{content:"";position:absolute;top:0;left:0;right:0;border-top:2px solid rgba(255,244,224,.6)}
.bunting i{flex:1;height:44px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
main{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 20vh;text-align:center;text-shadow:0 3px 22px rgba(10,10,50,.6)}
.chip{font-size:.95rem;border:1px solid rgba(255,244,224,.5);border-radius:99px;padding:5px 16px;margin-bottom:14px;background:rgba(20,18,58,.35);display:none}
.d300 .chip{display:block}
.d7 .chip{animation:pulse 1.4s ease-in-out infinite;border-color:#ffc46b;color:#ffc46b}
@keyframes pulse{50%{transform:scale(1.08)}}
h1{font:italic 600 clamp(2.4rem,11vw,5.5rem)/1.05 "Fraunces",Georgia,serif;margin:0 0 clamp(18px,5vh,40px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
.unit+.unit{border-left:1px solid rgba(255,244,224,.3)}
.num{font-weight:800;font-size:clamp(2.2rem,12vw,5rem);line-height:1}
.d7 .num{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 28px #ffc46b,0 0 6px #fff}}
.num.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:.4}}
.lbl{font-size:clamp(.8rem,3vw,1.05rem);margin-top:8px;opacity:.85}
.when{margin:clamp(16px,4vh,30px) 0 0;font-size:clamp(.9rem,3vw,1.05rem);line-height:1.6}
.party{font:italic 600 clamp(2.4rem,11vw,5.5rem)/1.05 "Fraunces",Georgia,serif}
#cv{z-index:4}
.dc{position:fixed;top:14px;right:14px;z-index:6;width:48px;height:48px;border-radius:50%;background:#5865f2;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .15s}
.dc:hover{transform:scale(1.1) rotate(-6deg)}
.dc:focus-visible{outline:3px solid #fff;outline-offset:3px}
.dc svg{width:26px;height:26px;fill:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="fx stars" id="stars"></div>
<div class="orb" id="moon"></div>
<div class="orb" id="sun"></div>
<div class="fx layer l300" id="clouds"></div>
<div class="fx layer l200" id="life"></div>
<div class="fx layer l100" id="balloons"></div>
<div class="hills" aria-hidden="true"><svg viewBox="0 0 1000 200" preserveAspectRatio="none">
<path style="fill:var(--h1)" d="M0 90C150 30 300 110 480 70C650 30 820 100 1000 55L1000 200L0 200Z"/>
<path style="fill:var(--h2)" d="M0 140C200 90 350 160 520 125C700 90 850 150 1000 120L1000 200L0 200Z"/></svg></div>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<main>
<div class="chip" id="chip"></div>
<h1 id="title"></h1>
<div id="out"></div>
<p class="when" id="when"></p>
</main>
<canvas class="fx" id="cv"></canvas>
<a class="dc" href="https://discord.gg/GXAYy5hpFm" target="_blank" rel="noopener" aria-label="Join my Discord server" title="Join my Discord server">
<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.74 19.74 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.1 13.1 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 01.078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.079.009c.12.099.246.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.84 19.84 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a>
<script>
(function(){
// ---- Settings (edit only these) ----
var NAME="izeriko is";            // optional, e.g. "Izeriko"
var TURNING_AGE=17, TURNING_YEAR=2026;  // later years add +1 automatically
var MONTH=11, DAY=6, HOUR_FR=6;         // November 6th, 06:00 France time (UTC+1 on that date)
var CELEBRATE_HOURS=24;
var STAGES=[300,200,100,31,15,7];       // days left when new things appear
// Preview: add ?days=5 and/or ?hour=14 to the address to test stages and time of day.

var DAY_MS=864e5, MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var Q=new URLSearchParams(location.search), T0=Date.now();
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(i){return document.getElementById(i)}
function R(a,b){return a+Math.random()*(b-a)}
function target(y){return Date.UTC(y,MONTH-1,DAY,HOUR_FR-1,0,0)}
function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

// ---- sky by time of day ----
var K=[[0,"0b0a28","14123a","2a2060","241a57","0d0b26",1],[5,"14123a","3b2a6e","7a4a8a","3a2a6a","15112f",.8],
[6.5,"3b3a8a","d0689a","ffb46b","4a3a7a","1c1840",.25],[9,"2a6bbd","5aa8e8","bfe3fa","5fa36f","3b7d55",0],
[12,"1f5fae","4a9be0","9fd3f5","5fa36f","3b7d55",0],[16,"2a6bbd","5aa8e8","cfe6f5","5fa36f","3b7d55",0],
[18,"3b4a9a","e0709a","ffb46b","5a3a6a","241a40",.25],[19.5,"1c1850","4a2f7a","b05a8a","3a2a6a","15112f",.7],
[21,"0b0a28","14123a","2a2060","241a57","0d0b26",1],[24,"0b0a28","14123a","2a2060","241a57","0d0b26",1]];
function mix(a,b,t){var o="#";for(var i=0;i<3;i++){var x=parseInt(a.substr(i*2,2),16),y=parseInt(b.substr(i*2,2),16);o+=("0"+Math.round(x+(y-x)*t).toString(16)).slice(-2)}return o}
function sky(h){
  var i=0;while(K[i+1][0]<h)i++;
  var a=K[i],b=K[i+1],t=(h-a[0])/(b[0]-a[0]),r=document.documentElement.style;
  ["s1","s2","s3","h1","h2"].forEach(function(n,j){r.setProperty("--"+n,mix(a[j+1],b[j+1],t))});
  r.setProperty("--day",(1-(a[6]+(b[6]-a[6])*t)).toFixed(3));
  var arc=function(el,p){el.style.left=(6+p*88)+"%";el.style.top=(80-Math.sin(Math.PI*p)*55)+"vh"};
  arc($("sun"),(h-6)/12);
  var m=(h-18+24)%24;if(m>=23.5)m-=24;
  arc($("moon"),m/12);
}

// ---- static decorations ----
(function(){
  var s=$("stars");for(var i=0;i<80;i++){var e=document.createElement("span");e.className="star";e.style.cssText="left:"+R(0,100)+"%;top:"+R(0,70)+"%;animation-delay:"+R(0,3)+"s";s.appendChild(e)}
  var c="";for(i=0;i<4;i++)c+='<div class="cloud" style="top:'+R(6,38)+'vh;animation-duration:'+R(70,130)+"s;animation-delay:-"+R(0,100)+'s"></div>';
  $("clouds").innerHTML=c;
  var l="";for(i=0;i<3;i++)l+='<svg class="bird" viewBox="0 0 34 14" style="top:'+R(10,40)+'vh;animation-duration:'+R(22,34)+"s;animation-delay:-"+R(0,30)+'s"><path d="M2 10Q9 0 17 9Q25 0 32 10"/></svg>';
  for(i=0;i<14;i++)l+='<i class="fly" style="left:'+R(3,97)+"%;top:"+R(55,85)+"vh;animation-delay:-"+R(0,6)+"s;animation-duration:"+R(4,8)+'s"></i>';
  $("life").innerHTML=l;
  var C=["#ff7a8a","#ffc46b","#7fd6c8","#a58cff","#fff4e0"],b="";
  for(i=0;i<10;i++)b+='<div class="balloon'+(i>=4?" more":"")+'" style="left:'+R(3,92)+"%;background-color:"+C[i%5]+";--c:"+C[i%5]+";animation-duration:"+R(16,26)+"s;animation-delay:-"+R(0,20)+'s"></div>';
  $("balloons").innerHTML=b;
  var f="";for(i=0;i<18;i++)f+='<i style="background:'+C[i%4]+";animation-delay:-"+R(0,3)+'s"></i>';
  $("bunting").innerHTML=f;
})();

// ---- fireworks + confetti ----
var cv=$("cv"),cx=cv.getContext("2d"),sparks=[],bits=[],raf=0,lastFw=0,confTarget=0,fwGap=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",size);size();
var PAL=["#ff7a8a","#ffc46b","#fff4e0","#7fd6c8","#a58cff"];
function burst(){var x=R(.15,.85)*cv.width,y=R(.1,.5)*cv.height,c=PAL[Math.floor(R(0,5))];
  for(var i=0;i<50;i++){var a=R(0,6.283),v=R(1.5,5);sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:c})}}
function loop(t){
  cx.clearRect(0,0,cv.width,cv.height);
  if(fwGap&&t-lastFw>fwGap){lastFw=t;burst()}
  cx.globalCompositeOperation="lighter";
  sparks=sparks.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.013;
    if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,3,3);return true});
  cx.globalCompositeOperation="source-over";cx.globalAlpha=1;
  while(bits.length<confTarget)bits.push({x:R(0,cv.width),y:-20,w:R(6,11),h:R(10,17),vy:R(1.5,4),vx:R(-1,1),r:R(0,6),vr:R(-.1,.1),c:PAL[bits.length%5]});
  bits=bits.filter(function(b){b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;
    if(b.y>cv.height+20){if(bits.length>confTarget)return false;b.y=-20;b.x=R(0,cv.width)}
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();return true});
  raf=(fwGap||confTarget||sparks.length||bits.length)?requestAnimationFrame(loop):0;
}
function fx(gap,conf){fwGap=reduce?0:gap;confTarget=reduce?0:conf;if(!raf&&(fwGap||confTarget))raf=requestAnimationFrame(loop)}

// ---- main tick ----
var out=$("out"),mode="",lastKey="",labels=["days","hours","minutes","seconds"];
function tick(){
  var now=Date.now(),y=new Date(now).getUTCFullYear(),t=target(y);
  if(now>=t+DAY_MS){y++;t=target(y)}
  var age=TURNING_AGE+(y-TURNING_YEAR),left=t-now;
  if(Q.get("days")!==null)left=Q.get("days")*DAY_MS-(now-T0);
  var party=left<=0&&left>-CELEBRATE_HOURS*36e5;
  var d=new Date(),h=Q.get("hour")!==null?+Q.get("hour"):d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
  sky(party?6.7:h%24);
  var days=left/DAY_MS,B=document.body.classList;
  STAGES.forEach(function(s){B.toggle("d"+s,!party&&days<s)});
  if(party){
    if(mode!=="party"){mode="party";$("chip").style.display="none";$("title").textContent="";
      out.className="";out.innerHTML='<div class="party">Happy '+ord(age)+" birthday"+(NAME?", "+NAME:"")+'!</div>';
      $("when").textContent="Sunrise, 06:00 in France";B.add("d300","d200","d100","d31","d15");fx(700,150)}
    return;
  }
  if(mode!=="count"||lastKey!==y){
    mode="count";lastKey=y;$("chip").style.display="";
    $("title").textContent=(NAME?NAME+" is turning ":"Turning ")+age+" in";
    out.className="grid";out.innerHTML=labels.map(function(l){return '<div class="unit"><div class="num" id="n-'+l+'">0</div><div class="lbl">'+l+"</div></div>"}).join("");
    var L=new Date(t),lt=L.toLocaleDateString("en-US",{weekday:"long"})+", "+MONTHS[L.getMonth()]+" "+ord(L.getDate())+" "+L.getFullYear()+" at "+L.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    $("when").innerHTML=MONTHS[MONTH-1]+" "+ord(DAY)+" "+y+", "+("0"+HOUR_FR).slice(-2)+":00 in France<br>Your time: "+lt;
  }
  var nx=STAGES.filter(function(s){return days<s}).pop();
  $("chip").textContent=nx?"Less than "+nx+" days to go":"";
  fx(days<7?1300:days<15?3800:0,days<7?50:0);
  var s=Math.floor(left/1e3),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  labels.forEach(function(l,i){var el=$("n-"+l),tx=i?("0"+v[i]).slice(-2):""+v[i];
    if(el.textContent!==tx){el.textContent=tx;if(i===3){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}}});
}
tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
